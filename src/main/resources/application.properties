# filepath: d:\projects\vizja\project_team09\src\main\resources\application.properties
# Server port
server.port=8081

# Application name
spring.application.name=test-automation-api

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/testautomationdb
spring.datasource.username=postgres
spring.datasource.password=2649
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
# Temporarily disable SQL logging for cleaner debug output
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Timezone Configuration
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Istanbul
spring.jackson.time-zone=Europe/Istanbul

# JWT Configuration
app.jwtSecret=mySecretKey
app.jwtExpirationMs=86400000

# Logging
logging.level.org.springframework=INFO
logging.level.com.vizja.testweb=DEBUG

# Actuator
management.endpoints.web.exposure.include=health,info,metrics

# Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads/excel-files
